<!doctype html>
<html lang="en">
  <head>
    <title>Account settings</title>
  </head>
  <body>
    <header><nav aria-label="Primary"><a href="/">Home</a></nav></header>
    <main>
      <h1>Account settings</h1>
      <img src="profile.png" alt="Profile placeholder">
      <form>
        <label for="email">Email</label>
        <input id="email" name="email" type="email">
        <button type="submit">Save</button>
      </form>
      <table>
        <caption>Notification preferences</caption>
        <tr><th>Channel</th><th>Enabled</th></tr>
        <tr><td>Email</td><td>Yes</td></tr>
      </table>
    </main>
  </body>
</html>
