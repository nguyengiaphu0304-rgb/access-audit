name: verify

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install verification tools
        run: |
          python -m pip install "pip>=26.1.2" "setuptools>=83.0.0"
          python -m pip install \
            "hatchling==1.28.0" \
            "build==1.4.0" \
            "ruff==0.14.14" \
            "mypy==1.19.1" \
            "pytest==9.0.3" \
            "pip-audit==2.10.0"
          python -m pip install --no-deps -e .
      - name: Lint and formatting
        run: |
          ruff check .
          ruff format --check .
      - name: Static typing
        run: mypy src scripts
      - name: Tests
        run: pytest
      - name: Reproducible synthetic evidence
        run: |
          mkdir demo-output
          python scripts/demo.py --output demo-output/report.json
          cmp evidence/failing-report.json demo-output/report.json
          python scripts/demo.py --output demo-output/report-second.json
          cmp demo-output/report.json demo-output/report-second.json
          python scripts/review_demo.py --output-directory demo-output/review
          cmp evidence/review-summary.json demo-output/review/review-summary.json
          cmp evidence/comparison.json demo-output/review/comparison.json
          cmp evidence/explorer.html demo-output/review/explorer.html
          python scripts/release_demo.py --output-directory demo-output/release
          diff -ru evidence/release demo-output/release
          python scripts/release_demo.py --output-directory demo-output/release-second
          diff -ru demo-output/release demo-output/release-second
      - name: Reproducible verified packages
        env:
          SOURCE_DATE_EPOCH: "315532800"
        run: |
          python -m build --outdir /tmp/raw-one
          python -m build --outdir /tmp/raw-two
          python scripts/package_release.py --dist /tmp/raw-one --output /tmp/release-one
          python scripts/package_release.py --dist /tmp/raw-two --output /tmp/release-two
          diff -ru /tmp/release-one /tmp/release-two
          cd /tmp/release-one
          sha256sum -c SHA256SUMS
      - name: Isolated wheel smoke
        run: |
          python -m venv /tmp/access-audit-wheel
          /tmp/access-audit-wheel/bin/python -m pip install \
            --no-index --no-deps /tmp/release-one/*.whl
          set +e
          /tmp/access-audit-wheel/bin/access-audit \
            fixtures/failing.html \
            --output /tmp/access-audit-report.json
          status=$?
          set -e
          test "$status" -eq 1
          cmp evidence/failing-report.json /tmp/access-audit-report.json
          /tmp/access-audit-wheel/bin/python - <<'PY'
          from access_audit import __version__, create_report, verify_report
          source = (
              b"<!doctype html><html lang='en'><head><title>x</title></head>"
              b"<body><main><h1>x</h1></main></body></html>"
          )
          report = create_report(source)
          verify_report(source, report)
          assert __version__ == "1.0.0"
          PY
      - name: Dependency consistency
        run: python -m pip check
      - name: Vulnerability audit
        run: python -m pip_audit --skip-editable
      - name: Repository hygiene
        run: |
          git diff --check
          test -z "$(git ls-files | grep -E '^(node_modules|dist|release|\.venv)/')"
          ! git grep -IEn \
            'BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|AKIA[0-9A-Z]{16}'
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: access-audit-v1.0.0
          path: |
            /tmp/release-one/access_audit-1.0.0-py3-none-any.whl
            /tmp/release-one/access_audit-1.0.0.tar.gz
            /tmp/release-one/SHA256SUMS
          retention-days: 14

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install locked browser toolchain
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Node checks and Chromium evidence
        run: npm test
      - name: Deterministic browser evidence
        run: |
          cp evidence/browser-report.json /tmp/browser-report-first.json
          cp evidence/combined-manifest.json /tmp/combined-manifest-first.json
          npm run evidence
          cmp /tmp/browser-report-first.json evidence/browser-report.json
          cmp /tmp/combined-manifest-first.json evidence/combined-manifest.json
      - name: Dependency audit
        run: npm audit --audit-level=high
      - uses: actions/upload-artifact@v4
        with:
          name: browser-evidence
          path: |
            evidence/browser-report.json
            evidence/combined-manifest.json
          retention-days: 14
